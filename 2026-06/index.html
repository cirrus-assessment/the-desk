<style>
  :root{--bg:#F4EFE3;--ink:#1A1612;--muted:#6b6358;--orange:#E76A25}
  html{color-scheme:light}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px}
  .wordmark{font-family:Georgia,"Times New Roman",serif;line-height:1}
  .wordmark .the{display:block;font-size:15px;letter-spacing:.02em;color:var(--ink)}
  .wordmark .desk{display:block;font-size:54px;font-weight:700;color:var(--orange);margin-top:-2px}
  .folio{margin-top:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .spinner{margin:26px auto 0;width:22px;height:22px;border:2px solid rgba(231,106,37,.25);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{margin-top:20px;font-size:15px}
  .fallback{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5}
  .fallback a{color:var(--orange);text-decoration:none;font-weight:600}
  .fallback a:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
